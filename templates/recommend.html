{% extends "base.html" %}
{% block title %}跨学科推荐 - InnoCite{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0"><i class="bi bi-lightbulb"></i> 跨学科推荐</h1>
</div>

<p class="text-muted mb-4">
    选择一篇源论文，系统将基于论文向量相似度，为你推荐来自不同学科的相关论文及其方法迁移建议。
</p>

<div class="row">
    <!-- 左侧：源论文选择（sticky） -->
    <div class="col-md-4">
        <div class="card mb-4 sticky-top" style="top: 76px; z-index: 100;">
            <div class="card-header fw-bold">
                <i class="bi bi-search"></i> 选择源论文
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">搜索论文</label>
                    <input type="text" id="paperSearch" class="form-control" placeholder="输入标题关键词筛选...">
                </div>
                <div class="mb-3">
                    <label class="form-label">论文列表</label>
                    <select id="paperSelect" class="form-select" size="10">
                        {% for paper in papers %}
                        <option value="{{ paper.id }}">
                            [{{ paper.category or 'N/A' }}] {{ paper.title[:50] }}{% if paper.title|length > 50 %}...{% endif %}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="row g-2">
                    <div class="col">
                        <label class="form-label small">推荐数量</label>
                        <select id="topN" class="form-select form-select-sm">
                            <option value="3" selected>3 条</option>
                            <option value="5">5 条</option>
                            <option value="10">10 条</option>
                        </select>
                    </div>
                    <div class="col">
                        <label class="form-label small">相似度阈值</label>
                        <input type="range" id="threshold" class="form-range" min="0" max="1" step="0.05" value="0.3">
                        <small class="text-muted" id="thresholdLabel">0.30</small>
                    </div>
                </div>
                <button class="btn btn-primary w-100 mt-3" onclick="getRecommendations()">
                    <i class="bi bi-lightbulb-fill"></i> 获取推荐
                </button>

                <!-- 源论文摘要 — 固定在左侧栏 -->
                <div class="mt-3" id="sourcePaperCard" style="display: none;">
                    <hr>
                    <div class="fw-bold small mb-1"><i class="bi bi-bookmark"></i> 源论文</div>
                    <h6 id="sourceTitle" class="small fw-bold mb-1"></h6>
                    <p class="small text-muted mb-1" id="sourceMeta"></p>
                    <p class="small text-muted" id="sourceAbstract" style="font-size:.78rem;"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- 右侧：推荐结果 -->
    <div class="col-md-8">

        <!-- 推荐结果（初始为空状态，查询后显示结果） -->
        <div id="recommendResults">
            <div class="text-center py-5 text-muted" id="recEmptyState">
                <i class="bi bi-arrow-left-circle" style="font-size: 3rem;"></i>
                <p class="mt-3">请选择一篇论文并点击"获取推荐"</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/recommend.js') }}"></script>
{% endblock %}
